---
- name: "Create or update pod user {{ _triere_pod_user.name }}"
  user:
    name: "{{ _triere_pod_user.name }}"
    comment: "Created by {{ ansible_role_name }} Ansible role"
    home: "{{ triere_homes_basedir }}/{{ _triere_pod_user.name }}"
    uid: "{{ _triere_pod_user.uid | d(omit) }}"
    shell: "{{ _triere_pod_user.shell | d('/bin/bash') }}"
    system: true

- name: "Get lingering status for user {{ _triere_pod_user.name }}"
  register: __triere_linger_stat
  stat:
    path: "/var/lib/systemd/linger/{{ _triere_pod_user.name }}"
    get_attributes: false
    get_checksum: false
    get_mime: false

- name: "Enable lingering for user {{ _triere_pod_user.name }}"
  when: not __triere_linger_stat.stat.exists
  command:
    argv:
      - loginctl
      - enable-linger
      - "{{ _triere_pod_user.name }}"

- name: "Create quadlets dir for user {{ _triere_pod_user.name }}"
  file:
    path: "{{ triere_homes_basedir }}/{{ _triere_pod_user.name }}/quadlets"
    state: directory
    owner: "{{ _triere_pod_user.name }}"
    group: "{{ _triere_pod_user.name }}"
    mode: "0750"
...
