---
- name: Podman installed
  package:
    name: podman

- name: Podman plugins installed
  when: ansible_distribution_major_version|int <=9
  package:
    name: podman-plugins

- name: Create homes basedir
  file:
    path: "{{ triere_homes_basedir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Include tasks for creating or updating pod users
  loop: "{{ triere_pods | map(attribute='user') | list | unique }}"
  loop_control:
    loop_var: _triere_pod_user
    label: "{{ _triere_pod_user.name }}"
  include_tasks:
    file: user.yml

- name: Include main loop
  loop: "{{ triere_pods }}"
  loop_control:
    loop_var: _triere_pod
    label: "{{ _triere_pod.pod }}@{{ _triere_pod.user }}"
  include_tasks:
    file: loop.yml
...
