---
- name: Podman installed
  package:
    name: podman

- name: Podman plugins installed
  when: ansible_distribution_major_version|int <= 9
  package:
    name: podman-plugins

- name: OS-dependent tasks included
  include_tasks:
    file: "{{ item }}"
  with_first_found:
    - files:
      - "{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}.yml"
      paths:
      - "{{ role_path }}/tasks"
      skip: true

- name: Create homes basedir
  file:
    path: "{{ triere_homes_basedir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set intermediate variables I
  set_fact:
    _triere_simple_users: "{{ triere_pods | map(attribute='user') | list | unique }}"
    _triere_users_custom_settings: "{{ triere_users_custom_settings | map(attribute='user') | list }}"

- name: Set intermediate variable II
  set_fact:
    _triere_simple_users_trimmed: "{{ _triere_simple_users | difference(_triere_users_custom_settings) }}"

- name: Set intermediate variable III
  set_fact:
    _triere_simple_users_kv: "{{ _triere_simple_users_trimmed | map('community.general.dict_kv', 'user') | list }}"

- name: Include tasks for creating or updating pod users (exclude superuser)
  loop: "{{ triere_users_custom_settings | union(_triere_simple_users_kv) | rejectattr('user', 'eq', 'root') | list }}"
  loop_control:
    loop_var: _triere_pod_user
    label: "{{ _triere_pod_user.user }}"
  include_tasks:
    file: user.yml

- name: Include Pod loop
  loop: "{{ triere_pods }}"
  loop_control:
    loop_var: _triere_pod
    label: "{{ _triere_pod.pod }}@{{ _triere_pod.user }}"
  include_tasks:
    file: loop.yml
...
