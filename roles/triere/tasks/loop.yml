---
- name: "Set env and cfg dir path fact | {{ _triere_pod.pod }}"
  set_fact:
    _triere_pod_cfg_dir: "{{ triere_homes_basedir }}/{{ _triere_pod.user.name }}/.local/lib/triere/cfg/{{ _triere_pod.pod }}"
    _triere_pod_app_dir: "{{ triere_homes_basedir }}/{{ _triere_pod.user.name }}/.local/lib/triere/apps/{{ _triere_pod.pod }}"

- name: "Read pod manifest | {{ _triere_pod.pod }}"
  include_vars:
    file: "{{ item }}"
    name: _tpm
  with_first_found:
    - paths:
        - "{{ inventory_dir }}/triere/pods"
        - "{{ inventory_dir }}/triere/pod"
      files:
        - "{{ _triere_pod.pod }}.yml"
        - "{{ _triere_pod.pod }}.yaml"

- name: "Assert that pod name is consistent between filename and metadata | {{ _triere_pod.pod }}"
  assert:
    that:
      - "_triere_pod.pod == _tpm.metadata.name"
    fail_msg: "Pod name mismatch: filename='{{ _triere_pod.pod }}' metadata='{{ _tpm.metadata.name }}'"

- name: "Include present/absent tasks | {{ _triere_pod.pod }}"
  include_tasks:
    file: "pod/{{ _triere_pod.state | d(true) | ternary('present', 'absent') }}.yml"
...
