---
- name: "Create env, cfg and app dir | {{ _triere_pod.pod }}"
  loop:
    - "{{ _triere_pod_cfg_dir }}"
    - "{{ _triere_pod_env_dir }}"
    - "{{ _triere_pod_app_dir }}"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ _triere_pod.user.name }}"
    group: "{{ _triere_pod.user.name }}"
    mode: "0750"

- name: "Include reconciliation tasks | {{ _triere_pod.pod }}"
  include_tasks:
    file: recon.yml

- name: "Include templating tasks | {{ _triere_pod.pod }}"
  include_tasks:
    file: templates.yml

- name: "Include tasks loop for containers | {{ _triere_pod.pod }}"
  loop: "{{ _tpm.spec.containers }}"
  loop_control:
    loop_var: _tcm
    label: "{{ _tcm.name }}"
  include_tasks:
    file: container/main.yml

- name: Become section
  become_user: "{{ _triere_pod.user.name }}"
  become: true
  block:
    - name: "Prune dangling images | {{ _triere_pod.pod }}"
      containers.podman.podman_prune:
        image: true
        image_filters:
          dangling_only: true

    - name: "Quadlet installed | {{ _triere_pod.pod }}"
      register: __triere_quadlet
      containers.podman.podman_quadlet:
        src: "{{ _triere_pod_app_dir }}"

    - name: "Print podman_quadlet module output | {{ _triere_pod.pod }}"
      when: __triere_quadlet is changed
      changed_when: true
      debug:
        var: __triere_quadlet

    - name: "Run podman quadlet generator for dry-run check | {{ _triere_pod.pod }}"
      register: __triere_generator_dryrun
      changed_when: false
      failed_when: false
      command:
        argv:
          - "/usr/lib/systemd/{{ (_triere_pod.user.name == 'root') | ternary('system-generators/podman-system', 'user-generators/podman-user') }}-generator"
          - --dryrun

    - name: "Print stderr and exit in case of failure | {{ _triere_pod.pod }}"
      when: __triere_generator_dryrun.rc != 0
      fail:
        msg: "{{ __triere_generator_dryrun.stderr }}"

    - name: "Service (re)started for pod changes update | {{ _triere_pod.pod }}"
      register: __triere_quadlet_svc
      systemd_service:
        name: "pod-{{ _tpm.metadata.name }}.service"
        # daemon_reload: "{{ __triere_quadlet is changed }}"
        state: "{{ (_triere_env_changed | d(false) or _triere_cfg_changed | d(false)) | ternary('restarted', 'started') }}"
        scope: "{{ (_triere_pod.user.name == 'root') | ternary('system', 'user') }}"

    - name: "Print status change from systemd_service module output | {{ _triere_pod.pod }}"
      when: __triere_quadlet_svc is changed
      changed_when: true
      debug:
        msg: "{{ __triere_quadlet_svc.status.ActiveState }} -> {{ __triere_quadlet_svc.state }}"
...
