---
argument_specs:
  main:
    short_description: The main entry point for the trireme role.
    options:
      trireme_pods:
        type: list
        elements: dict
        options:
          pod:
            type: str
            required: true
          user:
            type: dict
            required: true
            options:
              name:
                type: str
                required: true
              uid:
                type: int
              shell:
                type: path
                default: /bin/bash
          env_templates:
            type: list
            elements: dict
            options:
              name:
                type: str
                required: true
              dest:
                type: str
...
