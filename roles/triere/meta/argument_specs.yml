---
argument_specs:
  main:
    short_description: The main entry point for the triere role.
    options:
      triere_pods:
        type: list
        elements: dict
        options:
          pod:
            type: str
            required: true
          user:
            type: str
            required: true
          vars:
            type: dict
          immutable:
            type: bool
            default: false
            description: |
              Do not modify existing pods, networks and containers
          state:
            type: bool
            default: true

      triere_users_custom_settings:
        type: list
        elements: dict
        options:
          user:
            type: str
            required: true
          omit_password_lock:
            type: bool
            default: false
          password:
            type: str
          password_hash:
            type: str
          podman_socket_enabled:
            type: bool
            default: false
          uid:
            type: int
          shell:
            type: path
            default: /bin/bash
...
