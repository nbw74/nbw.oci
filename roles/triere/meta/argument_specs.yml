---
argument_specs:
  main:
    short_description: The main entry point for the triere role.
    options:
      triere_pods:
        type: list
        elements: dict
        options:
          pod:
            type: str
            required: true
          user:
            type: dict
            required: true
            options:
              name:
                type: str
                required: true
              uid:
                type: int
              shell:
                type: path
                default: /bin/bash
          cfg_templates:
            type: list
            elements: dict
            options:
              src:
                type: str
                required: true
              name:
                type: str
          env_templates:
            type: list
            elements: dict
            options:
              src:
                type: str
                required: true
              name:
                type: str
          state:
            type: bool
            default: true
...
