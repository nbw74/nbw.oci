---
argument_specs:
  main:
    short_description: The main entry point for the triere role.
    options:
      triere_pods:
        type: list
        elements: dict
        options:
          pod:
            type: str
            required: true
          user:
            type: dict
            required: true
            options:
              name:
                type: str
                required: true
              omit_password_lock:
                type: bool
                default: false
              password:
                type: str
              password_hash:
                type: str
              uid:
                type: int
              shell:
                type: path
                default: /bin/bash
          vars:
            type: dict
          state:
            type: bool
            default: true
...
